name: wago

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  evolution:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "3002:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_GLOBAL_API_KEY: ${WAHA_API_KEY:-devkey}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@postgres:5432/evolution"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_db
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      REDIS_PREFIX_KEY: evolution
      LOG_LEVEL: WARN
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Wago
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution-sessions:/evolution/instances
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - evolution
      - redis
    environment:
      NODE_ENV: production
      PORT: 3001
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      ORCHESTRATOR: local
      WAHA_HOST: evolution
      WAHA_API_KEY: ${WAHA_API_KEY:-devkey}
      WAHA_MAX_SESSIONS: 1
      WAHA_PORT: 3000
      REDIS_URL: redis://redis:6379
      API_URL: ${API_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  evolution-sessions:
  postgres-data:
